<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PacePulse — Global Running Club Discovery</title>

  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Globe.gl & Three.js Libraries -->
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    :root {
      --bg-dark: #0a0d14;
      --bg-card: #121824;
      --bg-card-hover: #1b2334;
      --accent-neon: #00ff88;
      --accent-hover: #00cc6d;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --border-color: #232d3f;
      --font-family: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      background: linear-gradient(180deg, rgba(10,13,20,0.9) 0%, rgba(10,13,20,0) 100%);
      pointer-events: none;
    }

    header * {
      pointer-events: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand i {
      font-size: 1.8rem;
      color: var(--accent-neon);
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Accessibility / Fallback Search */
    .city-search-fallback {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(18, 24, 36, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 2rem;
      padding: 0.4rem 1rem;
      backdrop-filter: blur(10px);
    }

    .city-search-fallback select {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    .city-search-fallback select option {
      background-color: var(--bg-card);
      color: var(--text-main);
    }

    /* Main Container & Globe */
    #globe-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Custom Globe Tooltip */
    .scene-tooltip {
      background: var(--bg-card) !important;
      border: 1px solid var(--accent-neon) !important;
      border-radius: 8px !important;
      padding: 8px 12px !important;
      color: var(--text-main) !important;
      font-family: var(--font-family) !important;
      box-shadow: 0 4px 20px rgba(0, 255, 136, 0.15);
    }

    /* Side Panel / Bottom Sheet */
    .panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 450px;
      height: 100vh;
      background: var(--bg-card);
      border-left: 1px solid var(--border-color);
      z-index: 20;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
    }

    .panel.open {
      transform: translateX(0);
    }

    .panel-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-back {
      background: var(--border-color);
      border: none;
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s;
    }

    .btn-back:hover {
      background: var(--text-muted);
      color: var(--bg-dark);
    }

    .panel-content {
      padding: 1.5rem;
      overflow-y: auto;
      flex: 1;
    }

    /* Filters & Sorting */
    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .filter-grid select, .filter-grid input {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    /* Club Cards */
    .club-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .club-card {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }

    .club-card:hover {
      border-color: var(--accent-neon);
      transform: translateY(-2px);
    }

    .club-card h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .club-card .tagline {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .rating-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #ffd166;
      margin-bottom: 0.75rem;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .badge.free {
      background: rgba(0, 255, 136, 0.1);
      color: var(--accent-neon);
      border-color: var(--accent-neon);
    }

    /* Club Detail Overlay */
    .club-detail-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-card);
      z-index: 30;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s ease-in-out;
    }

    .club-detail-overlay.active {
      transform: translateX(0);
    }

    /* Review Form */
    .review-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
    }

    .review-form input, .review-form textarea, .review-form select {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem;
      border-radius: 6px;
      font-family: inherit;
    }

    .btn-submit {
      background: var(--accent-neon);
      color: var(--bg-dark);
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    /* Mobile Responsive - Bottom Sheet */
    @media (max-width: 768px) {
      .panel {
        width: 100vw;
        height: 75vh;
        top: auto;
        bottom: 0;
        border-left: none;
        border-top: 1px solid var(--border-color);
        border-radius: 20px 20px 0 0;
        transform: translateY(100%);
      }

      .panel.open {
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <header>

  <!-- 3D Globe Container -->

  <!-- Side Panel / Bottom Sheet for City Clubs -->

    <div class="panel-content">
      <!-- Filtering & Sorting -->

            <option value="free">Free Only</option>
            <option value="paid">Paid Only</option>
          </select>
          <select id="filterPace">
            <option value="all">All Pace Levels</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Fast">Fast</option>
          </select>
          <select id="filterDay">
            <option value="all">Any Day</option>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
          </select>
          <select id="sortClubs">
            <option value="rating">Best Rated</option>
            <option value="reviews">Most Reviews</option>
            <option value="capacity-asc">Smallest Group</option>
            <option value="capacity-desc">Largest Group</option>
          </select>
        </div>
      </div>

      <!-- Club Cards List -->
      <div id="clubList" class="club-list"></div>
    </div>

    <!-- Club Detail Sub-Panel Overlay -->
    <div id="clubDetailOverlay" class="club-detail-overlay">
      <div class="panel-header">
        <button id="btnBackToCity" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Back to List</button>
      </div>
      <div id="clubDetailContent" class="panel-content"></div>

  </aside>

      {

        clubs: [

        ]

    // Load persisted state or initial data
    let globalData = JSON.parse(localStorage.getItem('pacepulse_data')) || initialCityData;

    function saveData() {
      localStorage.setItem('pacepulse_data', JSON.stringify(globalData));
    }

    /* =========================================================================
       2. GLOBE INITIALIZATION (Globe.gl)
       ========================================================================= */
    let activeCity = null;

    const globe = Globe()
      (document.getElementById('globe-container'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
      .htmlElementsData(globalData)
      .htmlElement(d => {
        const el = document.createElement('div');
        const totalClubs = d.clubs.length;
        el.innerHTML = `
          <div style="cursor:pointer; text-align:center;" onclick="selectCity('${d.city}')">
            <div style="width:16px; height:16px; background:#00ff88; border-radius:50%; box-shadow:0 0 12px #00ff88; margin:0 auto;"></div>
            <div style="background:rgba(18,24,36,0.9); padding:2px 8px; border-radius:12px; border:1px solid #00ff88; font-size:11px; white-space:nowrap; margin-top:4px;">
              <b>${d.city}</b> (${totalClubs})
            </div>
          </div>`;
        return el;
      });

    // Auto-rotation when idle
    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.6;

    /* =========================================================================
       3. INTERACTION & NAVIGATION
       ========================================================================= */
    const citySelect = document.getElementById('citySelect');
    const cityPanel = document.getElementById('cityPanel');
    const cityNameEl = document.getElementById('cityName');
    const clubListEl = document.getElementById('clubList');
    const clubDetailOverlay = document.getElementById('clubDetailOverlay');
    const clubDetailContent = document.getElementById('clubDetailContent');

    // Populate Accessibility Dropdown
    globalData.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.city;
      opt.textContent = `${c.city}, ${c.country} (${c.clubs.length} clubs)`;
      citySelect.appendChild(opt);
    });

    citySelect.addEventListener('change', (e) => {
      if (e.target.value) selectCity(e.target.value);
    });

    function selectCity(cityName) {
      const cityObj = globalData.find(c => c.city === cityName);
      if (!cityObj) return;

      activeCity = cityObj;
      cityNameEl.textContent = `${cityObj.city}, ${cityObj.country}`;

      // Animate Globe camera to location
      globe.pointOfView({ lat: cityObj.lat, lng: cityObj.lng, altitude: 0.8 }, 1800);
      globe.controls().autoRotate = false;

      // Render Clubs & Open Panel
      renderClubList();
      cityPanel.classList.add('open');
    }

    document.getElementById('btnBack').addEventListener('click', () => {
      cityPanel.classList.remove('open');
      clubDetailOverlay.classList.remove('active');
      globe.pointOfView({ altitude: 2.5 }, 1500);
      globe.controls().autoRotate = true;
    });

    document.getElementById('btnBackToCity').addEventListener('click', () => {
      clubDetailOverlay.classList.remove('active');
    });

    /* =========================================================================
       4. FILTERING, SORTING & CLUB LIST RENDERING
       ========================================================================= */
    const filterFree = document.getElementById('filterFree');
    const filterPace = document.getElementById('filterPace');
    const filterDay = document.getElementById('filterDay');
    const sortClubs = document.getElementById('sortClubs');

    [filterFree, filterPace, filterDay, sortClubs].forEach(el => el.addEventListener('change', renderClubList));

    function calculateAverageRating(reviews) {
      if (!reviews || reviews.length === 0) return 0;
      const sum = reviews.reduce((acc, r) => acc + r.rating, 0);
      return (sum / reviews.length).toFixed(1);
    }

    function renderClubList() {
      if (!activeCity) return;
      clubListEl.innerHTML = '';

      let filtered = [...activeCity.clubs];

      // Filters
      if (filterFree.value === 'free') filtered = filtered.filter(c => c.price.toLowerCase() === 'free');
      if (filterFree.value === 'paid') filtered = filtered.filter(c => c.price.toLowerCase() !== 'free');
      if (filterPace.value !== 'all') filtered = filtered.filter(c => c.paceLevels.includes(filterPace.value));
      if (filterDay.value !== 'all') filtered = filtered.filter(c => c.day === filterDay.value);

      // Sorting
      filtered.sort((a, b) => {
        const avgA = parseFloat(calculateAverageRating(a.reviews));
        const avgB = parseFloat(calculateAverageRating(b.reviews));
        if (sortClubs.value === 'rating') return avgB - avgA;
        if (sortClubs.value === 'reviews') return b.reviews.length - a.reviews.length;
        if (sortClubs.value === 'capacity-asc') return a.capacity - b.capacity;
        if (sortClubs.value === 'capacity-desc') return b.capacity - a.capacity;
        return 0;
      });

      if (filtered.length === 0) {
        clubListEl.innerHTML = `<p style="color:var(--text-muted); padding:1rem;">No clubs match your criteria.</p>`;
        return;
      }

      filtered.forEach(club => {
        const avgRating = calculateAverageRating(club.reviews);
        const card = document.createElement('div');
        card.className = 'club-card';
        card.onclick = () => openClubDetail(club.id);

        card.innerHTML = `
          <h3>${club.name}</h3>
          <div class="tagline">${club.tagline}</div>
          <div class="rating-badge">
            <i class="fa-solid fa-star"></i> ${avgRating} (${club.reviews.length} reviews)
          </div>
          <div class="badges">
            <span class="badge ${club.price === 'Free' ? 'free' : ''}">${club.price}</span>
            <span class="badge"><i class="fa-solid fa-users"></i> ${club.capacity} max</span>
            <span class="badge"><i class="fa-solid fa-calendar"></i> ${club.day}s ${club.time}</span>
          </div>
        `;
        clubListEl.appendChild(card);
      });
    }

    /* =========================================================================
       5. CLUB DETAIL VIEW & PERSISTENT REVIEWS
       ========================================================================= */
    function openClubDetail(clubId) {
      const club = activeCity.clubs.find(c => c.id === clubId);
      if (!club) return;

      const avgRating = calculateAverageRating(club.reviews);

      clubDetailContent.innerHTML = `
        <h2>${club.name}</h2>
        <p style="color:var(--text-muted); margin-bottom:1rem;">${club.tagline}</p>
        
        <div class="rating-badge" style="font-size:1.1rem;">
          <i class="fa-solid fa-star"></i> ${avgRating} / 5.0 (${club.reviews.length} reviews)
        </div>

        <p style="margin:1rem 0; line-height:1.5;">${club.description}</p>

        <div style="display:flex; flex-direction:column; gap:0.5rem; background:var(--bg-dark); padding:1rem; border-radius:8px; border:1px solid var(--border-color); margin-bottom:1.5rem;">
          <div><i class="fa-solid fa-location-dot" style="color:var(--accent-neon)"></i> <b>Meeting Point:</b> ${club.meetingPoint}</div>
          <div><i class="fa-solid fa-clock" style="color:var(--accent-neon)"></i> <b>Schedule:</b> Every ${club.day} at ${club.time}</div>
          <div><i class="fa-solid fa-route" style="color:var(--accent-neon)"></i> <b>Distance:</b> ${club.distance}</div>
          <div><i class="fa-solid fa-gauge-high" style="color:var(--accent-neon)"></i> <b>Paces:</b> ${club.paceLevels.join(', ')}</div>
          <div><i class="fa-solid fa-gift" style="color:var(--accent-neon)"></i> <b>Perks:</b> ${club.perks.join(', ')}</div>
        </div>

        <h3>Reviews</h3>
        <div id="reviewContainer" style="display:flex; flex-direction:column; gap:0.75rem; margin-top:1rem;">
          ${club.reviews.map(r => `
            <div style="background:var(--bg-dark); padding:0.75rem; border-radius:6px; border:1px solid var(--border-color);">
              <div style="display:flex; justify-space-between; align-items:center;">
                <b>${r.name}</b>
                <span style="color:#ffd166; font-size:0.85rem;"><i class="fa-solid fa-star"></i> ${r.rating}</span>
              </div>
              <div style="font-weight:600; font-size:0.9rem; margin-top:0.25rem;">${r.title}</div>
              <p style="font-size:0.85rem; color:var(--text-muted); margin-top:0.25rem;">${r.text}</p>
              <div style="font-size:0.7rem; color:var(--text-muted); margin-top:0.4rem;">${r.date}</div>
            </div>
          `).join('')}
        </div>

        <!-- Review Form -->
        <form id="addReviewForm" class="review-form">
          <h4>Leave a Review</h4>
          <select id="revRating" required>
            <option value="5">5 Stars - Outstanding</option>
            <option value="4">4 Stars - Very Good</option>
            <option value="3">3 Stars - Average</option>
            <option value="2">2 Stars - Below Expectation</option>
            <option value="1">1 Star - Poor</option>
          </select>
          <input type="text" id="revName" placeholder="Your Name" required />
          <input type="text" id="revTitle" placeholder="Review Title" required />
          <textarea id="revText" rows="3" placeholder="Write your experience..." required></textarea>
          <button type="submit" class="btn-submit">Submit Review</button>
        </form>
      `;

      clubDetailOverlay.classList.add('active');

      // Bind Review Submission
      document.getElementById('addReviewForm').onsubmit = (e) => {
        e.preventDefault();
        const newReview = {
          name: document.getElementById('revName').value,
          rating: parseInt(document.getElementById('revRating').value),
          title: document.getElementById('revTitle').value,
          text: document.getElementById('revText').value,
          date: new Date().toISOString().split('T')[0]
        };

        club.reviews.unshift(newReview);
        saveData();
        renderClubList();
        openClubDetail(clubId); // Re-render detail view instantly
      };
    }
  </script>
</body>
</html>
